<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#fff5f8; --ink:#5a2b40; --muted:#a07088; --rose:#cf6b91; --wine:#a8456b; --rule:#f0c4d8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1a0d12; --ink:#f6dce6; --muted:#c090a8; --rose:#f0a0c0; --wine:#f6bdd3; --rule:#5a2f44; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 400 1.15rem/1.65 'Newsreader', Georgia, serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 30em; border-left: 3px solid var(--rose); padding-left: 24px; }
    .num { font-family: 'Caveat', cursive; font-size: 2.2rem; line-height: 1; color: var(--rose); transform: rotate(-3deg); display: inline-block; }
    h1 { font-size: clamp(2.2rem, 8vw, 3.2rem); font-style: italic; font-weight: 400; line-height: 1.1; color: var(--wine); margin: 6px 0 12px; }
    p { color: var(--muted); }
    nav { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rose); }
    a:hover { color: var(--rose); }
  </style>
</head>
<body>
  <main>
    <span class="num">404</span>
    <h1>This page wandered off.</h1>
    <p>The link might be old, or there's a typo in the address. Nothing is broken on your side.</p>
    <nav>
      <a href="/">homepage</a>
      <a href="/diary/">diary</a>
      <a href="/Echo/">echo</a>
      <a href="/BlackboxD/">BlackboxD</a>
      <a href="/portofolio/">portfolio</a>
    </nav>
  </main>
</body>
</html>
